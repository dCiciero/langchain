[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dCiciero", email = "ivhurie01@yahoo.co.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.5",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
